[package]
name = "raptor-replica"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-2.0-or-later"
description = "Rust Raptor engine with deterministic simulation and local modding"

[features]
default = ["desktop"]
desktop = ["dep:sdl2"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
semver = { version = "1", features = ["serde"] }
sha2 = "0.10"
rhai = { version = "1.23", features = ["serde", "sync"] }
schemars = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }
sdl2 = { version = "0.38", optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"


[[bin]]
name = "raptor-rust"
path = "src/main.rs"
